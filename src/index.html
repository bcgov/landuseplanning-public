<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Planning in Partnership</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description"
        content="Find, learn about, and comment on active land and water planning engagements in British Columbia.">
    <link rel="icon" type="image/x-icon" href="https://landuseplanning.gov.bc.ca/favicon.ico">
    <link rel="preload" as="font" type="font/woff2"
        href="https://landuseplanning.gov.bc.ca/assets/fonts/MaterialIconsOutlined-Regular.woff2"
        crossorigin="anonymous">

    <!-- Snowplow starts plowing - Standalone vE.2.14.0 -->
    <script type="text/javascript">
        ; (function (p, l, o, w, i, n, g) {
            if (!p[i]) {
                p.GlobalSnowplowNamespace = p.GlobalSnowplowNamespace || [];
                p.GlobalSnowplowNamespace.push(i); p[i] = function () {
                    (p[i].q = p[i].q || []).push(arguments)
                }; p[i].q = p[i].q || []; n = l.createElement(o); g = l.getElementsByTagName(o)[0]; n.async = 1;
                n.src = w; g.parentNode.insertBefore(n, g)
            }
        }(window, document, "script", "https://www2.gov.bc.ca/StaticWebResources/static/sp/sp-2-14-0.js", "snowplow"));
        var collector = 'spt.apps.gov.bc.ca';
        window.snowplow('newTracker', 'rt', collector, {
            appId: "Snowplow_standalone",
            cookieLifetime: 86400 * 548,
            platform: 'web',
            post: true,
            forceSecureTracker: true,
            contexts: {
                webPage: true,
                performanceTiming: true
            }
        });
        window.snowplow('enableActivityTracking', 30, 30); // Ping every 30 seconds after 30 seconds
        window.snowplow('enableLinkClickTracking');
        window.snowplow('trackPageView');
    </script>
    <!-- Snowplow stop plowing -->
    <script src="./publicServerEnvironmentSettings.js"></script>
    <!-- Generated at cluster during the image deploy time by the run file in the nginx-runtime -->
    <style>
        .spinner-container.app-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            opacity: 0;
            background: #c5dec5;
            background: linear-gradient(338deg, rgba(197, 222, 197, 1) 0%, rgba(230, 235, 255, 1) 100%);
            transition: background-opacity 1s ease-in-out;
            animation: fadeIn 1s ease-in-out 2s forwards;
        }

        .spinner-container.app-loading h1 {
            margin-bottom: 3rem;
        }

        .spinner-container.app-loading p {
            margin-top: 3rem;
        }

        .spinner-container.app-loading .spinner-new.rotating.app-container {
            display: block;
            position: static;
            margin-top: 0;
            margin-left: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body id="top">
    <app-root>
        <div class="spinner-container app-loading" *ngIf="!results" aria-label="Loading...">
            <p>Welcome to</p>
            <h1>Planning in Partnership</h1>
            <div class="spinner-new rotating app-container"></div>
            <p>Please wait a moment while the website loads...</p>
        </div>
    </app-root>
</body>

</html>
