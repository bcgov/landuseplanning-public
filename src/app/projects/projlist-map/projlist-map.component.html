<div class="loading-container" @fade *ngIf="loading">
  <div class="spinner-new rotating"></div>
  <span class="spinner__msg">Loading map...</span>
</div>

<section class="map-container" role="application" [class.bw-filter]="loading">
  <div #map id="map" name="Map of BC that displays LUP Projects" aria-label="Map of BC that displays Land Use Plan Projects" ></div>
</section>
