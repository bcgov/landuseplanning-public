<div class="tab-pane" role="tabpanel">
  <section class="tab-section">
    <div class="row">
      <div class="col-12">
        <div class="map-item">
          <div class="map-wrapper">
            <div class="map-item__no-results" *ngIf="!project.centroid || project.centroid.length != 2">
              <span class="no-results-msg">No map available</span>
            </div>
            <div class="loading-container" @fade *ngIf="loading">
              <div class="spinner-new rotating"></div>
              <span class="spinner__msg">Loading map...</span>
            </div>
            <section class="map-container" role="application" [class.bw-filter]="loading">
              <div #map class="map" id="map" aria-label="Map of BC that displays Land Use Plan Projects"></div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <div class="project-details-text" [innerHTML]="project?.details"></div>
    <br *ngIf="project?.activitiesAndUpdatesEnabled">
    <div class="row" *ngIf="project?.activitiesAndUpdatesEnabled">
      <div class="col-12">
        <h2>Activities and Updates</h2>
        <app-project-activities [project]="project" [activities]="activities" [tableParams]="tableParams" (search)="onSearch($event)"></app-project-activities>
      </div>
    </div>
  </section>
</div>
