<div class="tab-pane" role="tabpanel">
  <form #f="ngForm" class="search-form ui form" (ngSubmit)="onSubmit()">
    <label for="keywordInput">Search activities and updates by title.</label>
    <div class="input-group main-search-field">
      <input class="form-control" type="text" name="keywordInput"
        id="keywordInput" [(ngModel)]="tableParams.keywords" />
      <div class="input-group-append">
        <!-- prevent searching if input is empty or we're already searching -->
        <button class="btn btn-main" type="submit">
          <span>Search</span>
        </button>
      </div>
    </div>
    <div class="results">
      <!-- <p *ngIf="!loading && tableParams.totalListItems == 0">
        No result<span *ngIf="count != 1">s</span> found for "{{tableParams.keywords}}"
      </p> -->
      <div *ngIf="tableParams?.totalListItems > 0">
        {{tableParams.totalListItems}} result<span *ngIf="tableParams?.totalListItems != 1">s</span> found
      </div>
    </div>
  </form>

  <section class="tab-section">
    <div *ngIf="activities?.length === 0">
      No recent activities.
    </div>

    <app-table-template *ngIf="activities?.length > 0"
      (checkboxChange)='checkChange($event)'
      [columns]="tableColumns"
      [data]="tableData"
      (onColumnSort)='setColumnSort($event)'
      (onSelectedRow)='updateSelectedRow($event)'
      (onPageNumUpdate)='getPaginatedDocs($event)'>
    </app-table-template>
  </section>
</div>
