kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: landuseplanning-public-prod
  namespace: e8b9ad-prod
  labels:
    app: landuseplanning-public-prod
    app.kubernetes.io/component: landuseplanning-public-prod
    app.kubernetes.io/instance: landuseplanning-public-prod
    app.kubernetes.io/part-of: landuseplanning-public-prod
spec:
  strategy:
    type: Rolling
    rollingParams:
      updatePeriodSeconds: 1
      intervalSeconds: 1
      timeoutSeconds: 600
      maxUnavailable: 25%
      maxSurge: 25%
    resources: {}
    activeDeadlineSeconds: 21600
  triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
          - landuseplanning-public-prod
        from:
          kind: ImageStreamTag
          namespace: e8b9ad-tools
          name: 'lup-public-deploy-image:prod'
        lastTriggeredImage: 'image-registry.openshift-image-registry.svc:5000/e8b9ad-tools/lup-public-deploy-image@sha256:d8f500fe31a17bb8875409c810e8943c1bcd7bed9979552c9b33768c65bdd16e'
    - type: ConfigChange
  replicas: 3
  revisionHistoryLimit: 10
  test: false
  selector:
    app: landuseplanning-public-prod
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: landuseplanning-public-prod
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 420
      containers:
        - resources: {}
          terminationMessagePath: /dev/termination-log
          name: landuseplanning-public-prod
          env:
            - name: API_URL
              value: 'https://www.planninginpartnership.ca/api'
            - name: REMOTE_API_PATH
              value: 'https://www.planninginpartnership.ca/api/public'
            - name: REMOTE_API_BASE_PATH
              value: 'https://www.planninginpartnership.ca/api'
            - name: REMOTE_ADMIN_PATH
              value: 'https://www.planninginpartnership.ca/admin'
            - name: DEPLOYMENT_ENVIRONMENT
              value: prod
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          terminationMessagePolicy: File
          image: 'image-registry.openshift-image-registry.svc:5000/e8b9ad-tools/lup-public-deploy-image@sha256:d8f500fe31a17bb8875409c810e8943c1bcd7bed9979552c9b33768c65bdd16e'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
