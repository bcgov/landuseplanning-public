apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: lup-public-trigger-template
  namespace: e8b9ad-tools
spec:
  params:
    - name: git-repo-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: lup-public-pipeline-run-
      spec:
        params:
          - name: git-url
            value: $(params.git-repo-url)
          - name: git-revision
            value: $(params.git-revision)
        pipelineRef:
          name: lup-public-build-deploy-dev
